name: Package OpenSCAD CLI

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/openscad-cli.yml
      - scripts/openscad-ci/**

permissions:
  contents: read

concurrency:
  group: openscad-cli-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENSCAD_TAG: openscad-2021.01
  OPENSCAD_COMMIT: 41f58fe57c03457a3a8b4dc541ef5654ec3e8c78
  VCPKG_COMMIT: 6f7ffeb18f99796233b958aaaf14ec7bd4fb64b2

jobs:
  validate:
    name: Validate packaging and release gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: peterisdev42/openscad
          ref: openscad-2021.01
          path: sources/openscad
      - run: python3 -m unittest discover -s scripts/openscad-ci -p 'test_*.py' -v

  build:
    name: ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-x64, runner: macos-15-intel, triplet: x64-osx }
          - { target: macos-arm64, runner: macos-15, triplet: arm64-osx }
    steps:
      - uses: actions/checkout@v4
      # Only fetch this source and MCAD, not the builder's other large submodules.
      - uses: actions/checkout@v4
        with:
          repository: peterisdev42/openscad
          ref: openscad-2021.01
          path: sources/openscad
          submodules: recursive
      - name: Verify immutable source revision
        shell: bash
        run: |
          actual_commit=$(git -C sources/openscad rev-parse 'HEAD^{commit}')
          echo "Expected source commit: $OPENSCAD_COMMIT"
          echo "Checked-out source commit: $actual_commit"
          test "$actual_commit" = "$OPENSCAD_COMMIT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select the supported Xcode toolchain
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          clang++ --version
      - name: Install macOS build tools
        run: |
          brew install bison flex pkg-config autoconf autoconf-archive automake libtool ccache
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "ACLOCAL_PATH=$(brew --prefix)/share/aclocal" >> "$GITHUB_ENV"
      - name: Install pinned build tools
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.3 meson==1.7.0 Mako==1.3.9 PyYAML==6.0.2 packaging==24.2
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 6f7ffeb18f99796233b958aaaf14ec7bd4fb64b2
          path: .build/vcpkg
      - uses: actions/cache/restore@v4
        id: dependency-cache
        with:
          path: |
            .build/vcpkg-cache
            .build/ccache
          key: openscad-deps-v2-${{ matrix.target }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('scripts/openscad-ci/vcpkg.json', 'scripts/openscad-ci/triplets/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            openscad-deps-v2-${{ matrix.target }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('scripts/openscad-ci/vcpkg.json', 'scripts/openscad-ci/triplets/**') }}-
            openscad-deps-v2-${{ matrix.target }}-${{ env.VCPKG_COMMIT }}-
      - name: Build macOS dependencies and CLI; test relocated package
        env:
          TARGET: ${{ matrix.target }}
          TRIPLET: ${{ matrix.triplet }}
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.build/vcpkg-cache,readwrite
          CCACHE_DIR: ${{ github.workspace }}/.build/ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: python scripts/openscad-ci/build.py
      - name: Save dependency cache (including partial builds)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .build/vcpkg-cache
            .build/ccache
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: openscad-cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.target }}
          include-hidden-files: true
          path: |
            .build/**/*.log
            .build/**/CMakeCache.txt
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: build
    # Publishing is restricted to the default branch; other branches can build artifacts.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: peterisdev42/openscad
          ref: openscad-2021.01
          path: sources/openscad
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          pattern: openscad-cli-*
          path: dist
          merge-multiple: true
      - name: Prepare source archive and verify release assets
        run: python3 scripts/openscad-ci/release.py
      - name: Publish all verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: openscad-cli-2021.01
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file .build/release-notes.md
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" --title "OpenSCAD 2021.01 headless CLI" \
              --notes-file .build/release-notes.md --latest=false
          fi
