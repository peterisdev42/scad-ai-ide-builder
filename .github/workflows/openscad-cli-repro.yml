name: Recheck OpenSCAD Windows x86 diagnostic package

on:
  workflow_call:
    inputs:
      package_run_id:
        required: true
        type: string
      context_provider:
        type: string
        default: wgl
  workflow_dispatch:
    inputs:
      package_run_id:
        description: ASan build run containing diagnostic-windows-x86-asan
        required: true
        type: string
      context_provider:
        description: Offscreen OpenGL context provider
        type: choice
        default: wgl
        options: [wgl, wgl-old]

permissions:
  contents: read
  actions: read

env:
  BUILD_ARCH: x86
  TARGET: windows-x86
  OPENSCAD_TAG: openscad-2026.10-TEST4
  OPENSCAD_ASAN: '1'
  PYTHONUTF8: '1'

jobs:
  recheck:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64
      - name: Initialize x86 dependency audit tools
        shell: pwsh
        run: ./scripts/openscad-ci/windows-tools.ps1
      - name: Download existing diagnostic package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: |
          if ($env:PACKAGE_RUN_ID -notmatch '^\d+$') { throw 'Expected a numeric run ID' }
          gh run download $env:PACKAGE_RUN_ID --repo $env:GITHUB_REPOSITORY --name diagnostic-windows-x86-asan --dir .runtime/artifact
          if ($LASTEXITCODE) { throw 'Diagnostic artifact download failed' }
      - name: Recheck relocated package without recompilation
        shell: bash
        env:
          OPENSCAD_OFFSCREEN_CONTEXT: ${{ inputs.context_provider }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import shutil
          import sys
          sys.path.insert(0, 'scripts/openscad-ci')
          from build import SOURCE_COMMIT, SOURCE_TAG, smoke_test
          root = Path('.runtime').resolve()
          archives = list((root / 'artifact').rglob('openscad-cli-windows-x86.zip'))
          if len(archives) != 1:
              raise RuntimeError(f'Expected one x86 archive, found {len(archives)}')
          relocated = root / 'relocated package'
          shutil.unpack_archive(archives[0], relocated)
          package = relocated / 'openscad-cli-windows-x86'
          info = json.loads((package / 'build-info.json').read_text())
          if (info.get('target') != 'windows-x86' or info.get('tag') != SOURCE_TAG
                  or info.get('commit') != SOURCE_COMMIT or not info.get('asan')):
              raise RuntimeError('Unexpected diagnostic package metadata')
          try:
              smoke_test(package, 'windows-x86', root)
          finally:
              log = root / 'smoke/smoke.log'
              if log.exists():
                  print(log.read_text(errors='replace'), flush=True)
          PY
      - name: Preserve runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: recheck-windows-x86-${{ inputs.context_provider }}
          path: .runtime/smoke/*
          if-no-files-found: ignore
